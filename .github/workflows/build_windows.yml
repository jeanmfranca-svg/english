name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Tauri CLI
        run: npm install @tauri-apps/cli@latest --save-dev

      - name: Inject Tauri v2 Config
        shell: bash
        run: |
          CONFIG_FILE=$(find . -name "tauri.conf.json" -not -path "*/node_modules/*" | head -n 1)
          echo "Atualizando: $CONFIG_FILE"
          node -e "
            const fs = require('fs');
            const file = '$CONFIG_FILE';
            if (fs.existsSync(file)) {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              data.productName = 'EnglishTeacher';
              data.version = '1.0.0';
              if (!data.package) data.package = {};
              data.package.productName = 'EnglishTeacher';
              data.package.version = '1.0.0';
              fs.writeFileSync(file, JSON.stringify(data, null, 2));
              console.log('Sucesso!');
            }
          "

      - name: Build Frontend
        shell: bash
        run: |
          npm run build -- --no-lint || npx next build || true

      - name: Build Tauri Executable
        shell: bash
        run: |
          TAURI_DIR=$(find . -name "tauri.conf.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname | xargs dirname)
          cd "$TAURI_DIR"
          npx tauri build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishTeacher-Windows-Setup
          path: |
            **/src-tauri/target/release/bundle/nsis/*.exe
            **/src-tauri/target/release/bundle/msi/*.msi
            **/src-tauri/target/release/*.exe
