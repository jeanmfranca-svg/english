name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Install Tauri CLI
        run: npm install @tauri-apps/cli@latest --save-dev

      - name: Inject Tauri v2 Config
        run: |
          $configFiles = Get-ChildItem -Recurse -Filter "tauri.conf.json"
          foreach ($file in $configFiles) {
            Write-Host "Atualizando: $($file.FullName)"
            $json = Get-Content $file.FullName -Raw | ConvertFrom-Json
            $json.productName = "EnglishTeacher"
            $json.version = "1.0.0"
            if (-not $json.package) { $json.package = @{} }
            $json.package.productName = "EnglishTeacher"
            $json.package.version = "1.0.0"
            $json | ConvertTo-Json -Depth 10 | Set-Content $file.FullName
          }

      - name: Build Tauri Executable
        run: |
          $config = Get-ChildItem -Recurse -Filter "tauri.conf.json" | Select-Object -First 1
          if ($config) {
            $tauriDir = $config.Directory.FullName
            Write-Host "Entrando na pasta: $tauriDir"
            Set-Location $tauriDir
            npx tauri build
          } else {
            throw "tauri.conf.json não encontrado!"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishTeacher-Windows-Setup
          path: |
            **/target/release/bundle/nsis/*.exe
            **/target/release/bundle/msi/*.msi
            **/target/release/*.exe
