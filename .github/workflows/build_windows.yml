name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Inject Tauri Config Parameters
        shell: bash
        run: |
          CONFIG_FILE=$(find . -name "tauri.conf.json" -not -path "*/node_modules/*" | head -n 1)
          echo "Atualizando arquivo: $CONFIG_FILE"
          node -e "
            const fs = require('fs');
            const file = '$CONFIG_FILE';
            if (fs.existsSync(file)) {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              data.productName = 'EnglishTeacher';
              data.version = '1.0.0';
              fs.writeFileSync(file, JSON.stringify(data, null, 2));
              console.log('tauri.conf.json atualizado com sucesso.');
            }
          "

      - name: Build Frontend
        shell: bash
        run: |
          npm run build -- --no-lint || npx next build || true

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: '.'
          tagName: v1.0.0
          releaseName: 'English Teacher v1.0.0'
          releaseBody: 'Instalador nativo para Windows (.exe)'
          releaseDraft: false
          prerelease: false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishTeacher-Windows-Setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
